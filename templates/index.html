<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03080d">
<link rel="manifest" href="/static/manifest.json">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#02070b;--line:rgba(90,220,255,.22);--cyan:#75eaff;--muted:#71909b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#e4fbff;font-family:Inter,Arial,"Noto Sans KR",sans-serif}
body{overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 50% 34%,rgba(0,200,255,.14),transparent 31%),
linear-gradient(rgba(80,220,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(80,220,255,.025) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}
.app{height:100dvh;display:flex;flex-direction:column;position:relative}
header{height:64px;min-height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:2}
.logo{font-size:18px;letter-spacing:5px;font-weight:600}.ready{font-size:9px;letter-spacing:2px;color:var(--cyan)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.hero{flex:0 0 43%;min-height:250px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.core{width:min(190px,43vw);height:min(190px,43vw);border:1px solid rgba(117,234,255,.65);border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 45px rgba(0,190,255,.12),inset 0 0 30px rgba(0,190,255,.07)}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(117,234,255,.3)}
.core:before{inset:16%}.core:after{inset:35%}
.arc{position:absolute;inset:-9px;border:1px dashed rgba(117,234,255,.35);border-radius:50%;animation:spin 12s linear infinite}
.dot{width:25%;height:25%;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#62eaff 30%,rgba(0,170,255,.15) 65%,transparent 70%);box-shadow:0 0 30px #35ddff}
@keyframes spin{to{transform:rotate(360deg)}}
.greet{text-align:center;margin-top:18px}.greet h1{font-size:18px;font-weight:400;letter-spacing:3px;margin:0 0 6px}.greet p{font-size:11px;color:var(--muted);margin:0}
.chat{flex:1;min-height:0;overflow:auto;padding:8px 16px 12px;scroll-behavior:smooth}
.msg{max-width:88%;margin:0 0 12px;padding:10px 12px;border-left:1px solid var(--line);background:rgba(8,25,34,.45);font-size:13px;line-height:1.55;white-space:pre-wrap}
.msg.user{margin-left:auto;border-left:0;border-right:1px solid var(--line);text-align:right;background:rgba(0,70,90,.18)}
.tag{font-size:8px;letter-spacing:2px;color:var(--cyan);display:block;margin-bottom:4px}
.composer{padding:10px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(2,7,11,.94);display:flex;gap:8px;z-index:3}
input{min-width:0;flex:1;background:#071219;border:1px solid var(--line);border-radius:22px;color:white;padding:13px 15px;outline:none;font-size:14px}
button{border:1px solid rgba(117,234,255,.45);background:#07141b;color:var(--cyan);border-radius:22px;min-width:46px;height:46px;cursor:pointer;font-size:18px}
button:active{transform:scale(.96)}
.mic{font-size:17px}
.send{font-size:12px;padding:0 15px}
@media(min-width:800px){
 header{padding:0 30px}
 main{display:grid;grid-template-columns:1fr 420px}
 .hero{height:auto;min-height:0}
 .chat{border-left:1px solid var(--line);padding:25px 22px}
 .composer{grid-column:1/-1}
 .greet h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">J.A.R.V.I.S.</div><div class="ready" id="status">SYSTEM READY</div></header>
<main>
<section class="hero">
 <div class="core"><div class="arc"></div><div class="dot"></div></div>
 <div class="greet"><h1>무엇을 도와드릴까요?</h1><p>말씀하십시오.</p></div>
</section>
<section class="chat" id="chat">
 <div class="msg"><span class="tag">JARVIS</span>시스템이 준비되었습니다.</div>
</section>
</main>
<form class="composer" id="form">
 <button type="button" class="mic" id="mic" aria-label="음성 입력">🎙</button>
 <input id="input" placeholder="자비스에게 말씀하세요…" autocomplete="off">
 <button class="send" type="submit">전송</button>
</form>
</div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("input"), status=document.getElementById("status");
let history=[];
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function add(role,text){
 const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"");
 d.innerHTML='<span class="tag">'+(role==="user"?"YOU":"JARVIS")+'</span>'+esc(text);
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
async function send(text){
 text=text.trim();if(!text)return;
 add("user",text);input.value="";status.textContent="PROCESSING…";
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history})});
  const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||"알 수 없는 오류");
  add("assistant",d.reply);history.push({role:"user",content:text},{role:"assistant",content:d.reply});
  if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(d.reply);u.lang="ko-KR";u.rate=.94;speechSynthesis.speak(u)}
 }catch(e){add("assistant",e.message);status.textContent="SYSTEM ERROR";return}
 status.textContent="SYSTEM READY";
}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();send(input.value)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 const rec=new SR();rec.lang="ko-KR";rec.interimResults=false;rec.continuous=false;
 document.getElementById("mic").onclick=()=>{status.textContent="LISTENING…";rec.start()};
 rec.onresult=e=>send(e.results[0][0].transcript);
 rec.onerror=()=>status.textContent="SYSTEM READY";
}else document.getElementById("mic").style.opacity=".35";
</script>
</body>
</html>
